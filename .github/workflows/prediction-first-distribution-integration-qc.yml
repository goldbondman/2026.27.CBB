name: Prediction First Distribution Integration QC
on:
  push:
    paths:
      - 'scripts/prediction_first_distribution_integration_qc.py'
      - '.github/workflows/prediction-first-distribution-integration-qc.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: cbb-gate-batch-15
          path: /tmp/g15
          github-token: ${{ github.token }}
          run-id: 37175629711
      - uses: actions/download-artifact@v4
        with:
          name: cbb-gate-batch-10
          path: /tmp/g10
          github-token: ${{ github.token }}
          run-id: 37171572901
      - uses: actions/download-artifact@v4
        with:
          name: prediction-first-venue-alias-final
          path: /tmp/venue
          github-token: ${{ github.token }}
          run-id: 37988473245
      - run: python scripts/prediction_first_distribution_integration_qc.py
      - uses: actions/upload-artifact@v4
        with:
          name: prediction-first-distribution-integration-qc
          path: results/prediction_first_distribution_integration_qc
          retention-days: 90
