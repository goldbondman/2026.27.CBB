name: Prediction First Venue Debug
on:
  push:
    paths:
      - '.github/workflows/prediction-first-venue-debug.yml'
      - 'scripts/prediction_first_venue_coverage_debug.py'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .
      - name: Download G15 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/g15
          gh api repos/${{ github.repository }}/actions/artifacts/11293620780/zip > /tmp/g15.zip
          unzip -q /tmp/g15.zip -d /tmp/g15
      - run: python scripts/prediction_first_venue_coverage_debug.py
