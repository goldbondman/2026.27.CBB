name: Component context retry
on:
  push:
    paths:
      - scripts/component_retry.py
      - .github/workflows/component-retry.yml
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install pandas pyarrow numpy scipy scikit-learn
      - run: python scripts/component_retry.py
      - uses: actions/upload-artifact@v4
        with:
          name: component-retry-results
          path: results/component_retry
          retention-days: 30
