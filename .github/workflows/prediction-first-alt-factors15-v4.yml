name: Prediction First Alternative Factors 15 v4
on:
  push:
    paths:
      - 'scripts/prediction_first_alt_factors15_v4.py'
      - '.github/workflows/prediction-first-alt-factors15-v4.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .
      - name: Download immutable v14 freeze artifact
        uses: actions/download-artifact@v4
        with:
          name: prediction-first-fourth15
          path: /tmp/freeze
          github-token: ${{ github.token }}
          run-id: 38157090295
      - name: Execute T34.01 through T34.15 with ESPN adapter
        run: python scripts/prediction_first_alt_factors15_v4.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prediction-first-alt-factors15-v4
          path: results/prediction_first_alt_factors15_v3
