name: One-off NCAAB 2026-27 source staging
on:
  push:
    branches:
      - research/ncaab2027-staging-20261106
    paths:
      - .github/workflows/ncaab2027_source_staging.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract-2027:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parsing dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow requests
      - name: Fetch and validate official-derived and ESPN-derived source files
        run: python scripts/ncaab2027_staging_extract.py
      - name: Preserve one-off QA output as a short-lived artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncaab2027-source-qa
          path: source_staging_2027/
          retention-days: 2
          if-no-files-found: ignore
