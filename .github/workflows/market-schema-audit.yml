name: Market schema audit
on:
  push:
    paths:
      - scripts/market_schema_audit.py
      - .github/workflows/market-schema-audit.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas
      - run: python scripts/market_schema_audit.py
