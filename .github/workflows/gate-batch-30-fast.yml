name: Thirty-gate full-season market robustness fast
on:
  push:
    paths:
      - 'scripts/gate_batch_30_fast.py'
      - '.github/workflows/gate-batch-30-fast.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install pandas pyarrow numpy scipy scikit-learn
      - run: python scripts/gate_batch_30_fast.py
      - uses: actions/upload-artifact@v4
        with:
          name: gate-batch-30-fast-results
          path: results/gate_batch_30_fast
          retention-days: 30
