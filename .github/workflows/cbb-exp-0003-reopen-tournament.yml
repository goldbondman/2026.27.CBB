name: CBB EXP 0003 Formal Reopen Tournament
on:
  push:
    paths:
      - 'scripts/cbb_exp_0003_formal_reopen_tournament.py'
      - '.github/workflows/cbb-exp-0003-reopen-tournament.yml'
  workflow_dispatch:
jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Download immutable v14 freeze artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/freeze
          gh api repos/${{ github.repository }}/actions/artifacts/11709535789/zip > /tmp/freeze.zip
          unzip -q /tmp/freeze.zip -d /tmp/freeze
      - name: Run CBB-EXP-0003
        run: python scripts/cbb_exp_0003_formal_reopen_tournament.py
      - uses: actions/upload-artifact@v4
        with:
          name: cbb-exp-0003-reopen-tournament
          path: results/cbb_exp_0003_reopen_tournament/
          retention-days: 90
