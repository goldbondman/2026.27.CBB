name: Prediction First Venue Pace Ablation
on:
  push:
    paths:
      - '.github/workflows/prediction-first-venue-pace-ablation.yml'
      - 'scripts/prediction_first_venue_pace_ablation.py'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .
      - name: Download pace and venue artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/g10 /tmp/venue
          gh api repos/${{ github.repository }}/actions/artifacts/11291726474/zip > /tmp/g10.zip
          gh api repos/${{ github.repository }}/actions/artifacts/11644132841/zip > /tmp/venue.zip
          unzip -q /tmp/g10.zip -d /tmp/g10
          unzip -q /tmp/venue.zip -d /tmp/venue
      - run: python scripts/prediction_first_venue_pace_ablation.py
      - uses: actions/upload-artifact@v4
        with:
          name: prediction-first-venue-pace-ablation
          path: results/prediction_first_venue_pace_ablation
          if-no-files-found: error
