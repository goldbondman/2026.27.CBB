name: Twenty-five-gate quoted-price validation
on:
  push:
    paths:
      - scripts/gate_batch_25.py
      - .github/workflows/gate-batch-25.yml
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install pandas pyarrow numpy scipy scikit-learn
      - run: python scripts/gate_batch_25.py
      - uses: actions/upload-artifact@v4
        with:
          name: gate-batch-25-results
          path: results/gate_batch_25
          retention-days: 30
