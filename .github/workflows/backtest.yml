name: Backtest
on:
  workflow_dispatch:
    inputs:
      input_path: {description: Canonical cached dataset path, required: true}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -e .
      - run: python -m cbb.backtest.run --config configs/production/r1_r2.yaml --input '${{ inputs.input_path }}' --output results/run
      - uses: actions/upload-artifact@v4
        with: {name: backtest-results, path: results/run}

