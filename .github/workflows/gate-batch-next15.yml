name: Next fifteen-gate research batch

on:
  workflow_dispatch:
  push:
    branches:
      - codex/build-github-based-engineering-infrastructure-kdb9cz
    paths:
      - 'scripts/gate_batch_next15.py'
      - '.github/workflows/gate-batch-next15.yml'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research dependencies
        run: python -m pip install pandas pyarrow numpy scipy scikit-learn
      - name: Execute next fifteen-gate historical batch
        run: python scripts/gate_batch_next15.py
      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbb-gate-batch-next15
          path: results/gate_batch_next15
          if-no-files-found: error
          retention-days: 30
