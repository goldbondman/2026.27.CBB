name: Prediction First Next 15
on:
  push:
    paths:
      - 'scripts/prediction_first_next15.py'
      - 'scripts/prediction_first_next15_v2.py'
      - '.github/workflows/prediction-first-next15.yml'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .
      - name: Execute T18-T19 gates
        run: python scripts/prediction_first_next15_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: prediction-first-next15
          path: results/prediction_first_next15
