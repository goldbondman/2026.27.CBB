name: Prediction First Recency Activation 15 Final
on:
  push:
    paths:
      - '.github/workflows/prediction-first-recency-activation15-final.yml'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Download immutable v14 freeze artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/freeze
          gh api repos/${{ github.repository }}/actions/artifacts/11709535789/zip > /tmp/freeze.zip
          unzip -q /tmp/freeze.zip -d /tmp/freeze
      - name: Execute final repaired T37.01 through T37.15
        run: python scripts/prediction_first_recency_activation15_repair.py
      - uses: actions/upload-artifact@v4
        with:
          name: prediction-first-recency-activation15-final
          path: results/prediction_first_recency_activation15/
          retention-days: 90
