name: Inspect full-season market schema
on:
  push:
    paths:
      - 'scripts/inspect_fullseason_market_schema.py'
      - '.github/workflows/inspect-fullseason-market.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas
      - run: python scripts/inspect_fullseason_market_schema.py
