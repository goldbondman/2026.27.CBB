name: Prediction First Roster 15 Repair
on:
  push:
    paths:
      - 'scripts/prediction_first_earlyseason_robust15.py'
      - '.github/workflows/prediction-first-roster15-repair.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .
      - name: Download immutable v14 freeze artifact
        uses: actions/download-artifact@v4
        with:
          name: prediction-first-fourth15
          path: /tmp/freeze
          github-token: ${{ github.token }}
          run-id: 38157090295
      - name: Download historical roster artifact
        uses: actions/download-artifact@v4
        with:
          name: prediction-first-roster15
          path: /tmp/roster1
          github-token: ${{ github.token }}
          run-id: 38165307111
      - name: Execute T29.01 through T29.15
        run: python scripts/prediction_first_earlyseason_robust15.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prediction-first-earlyseason-robust15
          path: results/prediction_first_earlyseason_robust15
