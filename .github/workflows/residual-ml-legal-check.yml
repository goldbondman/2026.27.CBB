name: Residual ML legal check
on:
  workflow_dispatch:
  push:
    branches:
      - codex/build-github-based-engineering-infrastructure-kdb9cz
    paths:
      - 'scripts/residual_ml_legal_check.py'
      - '.github/workflows/residual-ml-legal-check.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install pandas pyarrow numpy scipy scikit-learn
      - run: python scripts/residual_ml_legal_check.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: residual-ml-legal-check
          path: results/residual_ml_legal_check
          if-no-files-found: error
          retention-days: 30
