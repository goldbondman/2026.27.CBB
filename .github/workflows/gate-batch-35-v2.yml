name: Thirty-five-gate actual-price validation corrected
on:
  push:
    paths:
      - 'scripts/gate_batch_35_v2.py'
      - '.github/workflows/gate-batch-35-v2.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install pandas pyarrow numpy scipy scikit-learn
      - run: python scripts/gate_batch_35_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: gate-batch-35-v2-results
          path: results/gate_batch_35_v2
          retention-days: 30
