name: Audit quoted price completeness by season
on:
  push:
    paths:
      - 'scripts/gate_batch_35_price_coverage.py'
      - '.github/workflows/gate-batch-35-price-coverage.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas
      - run: python scripts/gate_batch_35_price_coverage.py
      - uses: actions/upload-artifact@v4
        with:
          name: gate-batch-35-price-coverage-results
          path: results/gate_batch_35_price_coverage
          retention-days: 30
