name: Canonical data build

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'src/cbb/data/**'
      - '.github/workflows/canonical-data-build.yml'
      - 'requirements.lock'

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m cbb.data.build_historical --seasons 2021 2022 2023 2024 2025 --output data/canonical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sportsdataverse-source-inventory
          path: data/canonical/source_inventory.json
          if-no-files-found: error
