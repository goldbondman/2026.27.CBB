name: Prediction First Venue Alias Final
on:
  push:
    paths:
      - '.github/workflows/prediction-first-venue-alias-final.yml'
      - 'scripts/prediction_first_venue_alias_final.py'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .
      - name: Download frozen G15 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/g15
          gh api repos/${{ github.repository }}/actions/artifacts/11293620780/zip > /tmp/g15.zip
          unzip -q /tmp/g15.zip -d /tmp/g15
      - name: Execute final T16 venue audit
        run: python scripts/prediction_first_venue_alias_final.py
      - uses: actions/upload-artifact@v4
        with:
          name: prediction-first-venue-alias-final
          path: results/prediction_first_venue_alias_final
          if-no-files-found: error
