name: Prediction First Post Freeze 15
on:
  push:
    paths:
      - 'scripts/prediction_first_postfreeze15.py'
      - 'scripts/prediction_first_postfreeze15_v2.py'
      - '.github/workflows/prediction-first-postfreeze15.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .
      - name: Download frozen v14 artifact
        uses: actions/download-artifact@v4
        with:
          name: prediction-first-fourth15
          path: /tmp/freeze
          github-token: ${{ github.token }}
          run-id: 38157090295
      - name: Execute T24.01 through T24.15
        run: python scripts/prediction_first_postfreeze15_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prediction-first-postfreeze15
          path: results/prediction_first_postfreeze15
