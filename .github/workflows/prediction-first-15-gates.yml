name: Prediction First 15 Gates
on:
  push:
    paths:
      - '.github/workflows/prediction-first-15-gates.yml'
      - 'scripts/prediction_first_15_gates.py'
      - 'scripts/prediction_first_15_gates_patch.py'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .
      - name: Download prior frozen research artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/g15 /tmp/g10
          gh api repos/${{ github.repository }}/actions/artifacts/11293620780/zip > /tmp/g15.zip
          gh api repos/${{ github.repository }}/actions/artifacts/11291726474/zip > /tmp/g10.zip
          unzip -q /tmp/g15.zip -d /tmp/g15
          unzip -q /tmp/g10.zip -d /tmp/g10
          ls -lah /tmp/g15 /tmp/g10
      - name: Execute T16-T17 prediction-first gates
        run: python scripts/prediction_first_15_gates_patch.py
      - uses: actions/upload-artifact@v4
        with:
          name: prediction-first-15-gates
          path: results/prediction_first_15_gates
          if-no-files-found: error
