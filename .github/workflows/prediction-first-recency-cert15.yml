name: Prediction First Recency Certification 15
on:
  push:
    paths:
      - 'scripts/prediction_first_recency_cert15.py'
      - '.github/workflows/prediction-first-recency-cert15.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .
      - name: Download immutable v14 freeze artifact
        uses: actions/download-artifact@v4
        with:
          name: prediction-first-fourth15
          path: /tmp/freeze
          github-token: ${{ github.token }}
          run-id: 38157090295
      - name: Execute T36.01 through T36.15
        run: python scripts/prediction_first_recency_cert15.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prediction-first-recency-cert15
          path: results/prediction_first_recency_cert15
